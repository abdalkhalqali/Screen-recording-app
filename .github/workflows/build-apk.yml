name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # يسمح بالتشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x gradlew

      - name: 🔑 إنشاء Keystore للتوقيع
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias screenrecorder -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass screenrec -keypass screenrec \
            -dname "CN=ScreenRecorder, OU=Dev, O=App, L=City, S=State, C=SA"

      - name: 🏗️ بناء APK (Release موقّع)
        run: |
          export KEYSTORE_FILE="release.keystore"
          export KEYSTORE_PASSWORD="screenrec"
          export KEY_ALIAS="screenrecorder"
          export KEY_PASSWORD="screenrec"
          ./gradlew assembleRelease --no-daemon

      - name: 📦 رفع APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: 📋 عرض معلومات الحجم
        run: ls -lh app/build/outputs/apk/release/app-release.apk || echo "لم يتم العثور على APK"
