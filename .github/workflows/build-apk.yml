name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # يسمح بالتشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x gradlew

      - name: 🏗️ بناء APK (Debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 رفع APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: 📋 عرض معلومات الحجم
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk || echo "لم يتم العثور على APK"
