plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.kotlinAndroid)
    id 'maven-publish'
}

android {
    namespace 'io.codingskuy.qa_snap'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // SDK version information
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation libs.appcompat
    implementation libs.material

    // For media projection and recording
    implementation libs.activity
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// JitPack publishing configuration
afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                from components.release

                groupId = 'io.codingskuy'
                artifactId = 'qa-snap-sdk'
                version = '1.0.0'

                pom {
                    name = 'QA Snap SDK'
                    description = 'Android SDK for QA testing with screen recording and log capture capabilities'
                    url = 'https://github.com/Coding-Skuy/qa-snap-sdk'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'coding-skuy'
                            name = 'Coding Skuy Team'
                            email = 'codingskuy.io@gmail.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/Coding-Skuy/qa-snap-sdk.git'
                        developerConnection = 'scm:git:ssh://git@github.com/Coding-Skuy/qa-snap-sdk.git'
                        url = 'https://github.com/Coding-Skuy/qa-snap-sdk'
                    }
                }
            }
        }
    }
}

