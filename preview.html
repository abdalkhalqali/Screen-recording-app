<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسجل الشاشة - معاينة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorative elements */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: float 8s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-100px) scale(1.5); opacity: 0.8; }
        }

        /* Info Header */
        .info-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 16px 24px;
            text-align: center;
            z-index: 100;
        }

        .info-header h2 {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .info-header h2 span {
            color: #818cf8;
        }

        .info-header p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 4px;
        }

        /* Phone Container */
        .phone-wrapper {
            position: relative;
            margin-top: 80px;
            margin-bottom: 40px;
        }

        .phone {
            width: 340px;
            height: 700px;
            background: linear-gradient(180deg, #1c1c2e 0%, #14142a 100%);
            border-radius: 48px;
            padding: 16px;
            position: relative;
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.05),
                0 0 0 4px rgba(0,0,0,0.3),
                0 25px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(99, 102, 241, 0.06);
            transition: transform 0.3s ease;
        }

        .phone:hover {
            transform: translateY(-5px);
        }

        /* Notch */
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 30px;
            background: #0f0f1a;
            border-radius: 0 0 20px 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .phone-notch::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #1a1a3e;
            border-radius: 50%;
            border: 2px solid #2a2a4e;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 8px 12px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            font-weight: 500;
            direction: ltr;
        }

        .status-bar .time {
            font-weight: 700;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-icons svg {
            width: 16px;
            height: 16px;
            fill: rgba(255,255,255,0.6);
        }

        /* Screen Content */
        .phone-screen {
            background: #0f0f1a;
            border-radius: 32px;
            height: calc(100% - 50px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* App Bar */
        .app-bar {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-bar .app-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-bar .app-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .app-bar h1 {
            color: white;
            font-size: 16px;
            font-weight: 700;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .welcome-text {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
            padding: 0 10px;
        }

        .welcome-text strong {
            color: rgba(255,255,255,0.9);
        }

        /* Screen Preview Area */
        .screen-preview {
            width: 100%;
            flex: 1;
            background: linear-gradient(135deg, #1e1e3a 0%, #2a1a4e 100%);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }

        .screen-preview .recording-indicator {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen-preview .recording-indicator.active {
            opacity: 1;
        }

        .screen-preview .recording-indicator .dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .screen-preview .recording-indicator span {
            color: #ef4444;
            font-size: 11px;
            font-weight: 500;
        }

        .screen-preview .preview-icon {
            text-align: center;
            animation: subtleFloat 3s ease-in-out infinite;
        }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .screen-preview .preview-icon svg {
            width: 64px;
            height: 64px;
            fill: rgba(255,255,255,0.15);
            margin-bottom: 12px;
        }

        .screen-preview .preview-icon p {
            color: rgba(255,255,255,0.25);
            font-size: 13px;
        }

        /* Start Button */
        .start-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .start-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .start-button:hover::before {
            opacity: 1;
        }

        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .start-button:active {
            transform: translateY(0);
        }

        .start-button.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .start-button.recording:hover {
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
        }

        .start-button .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Navigation Bar (Home Indicator) */
        .nav-bar {
            padding: 10px 0;
            display: flex;
            justify-content: center;
        }

        .home-indicator {
            width: 120px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }

        /* Side buttons */
        .phone-side-buttons {
            position: absolute;
            right: -4px;
            top: 120px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-btn {
            width: 4px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border-radius: 0 2px 2px 0;
        }

        /* Info cards */
        .info-cards {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .info-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            min-width: 140px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255,255,255,0.06);
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .info-card .card-icon {
            width: 40px;
            height: 40px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .info-card .card-icon svg {
            width: 20px;
            height: 20px;
            fill: #818cf8;
        }

        .info-card h3 {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .info-card p {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }

        /* Preview badge */
        .preview-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            animation: badgePulse 2s infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(16, 185, 129, 0.5); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .phone {
                width: 300px;
                height: 600px;
                border-radius: 40px;
                padding: 12px;
            }

            .phone-notch {
                width: 110px;
                height: 26px;
            }

            .screen-preview {
                min-height: 220px;
            }

            .info-cards {
                flex-direction: column;
                align-items: center;
            }
        }

        /* Toast notification simulation */
        .toast-sim {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 12px;
            color: #fca5a5;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200;
            text-align: center;
        }

        .toast-sim.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-sim .toast-icon {
            display: inline-block;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div class="particles"></div>

    <!-- Info Header -->
    <div class="info-header">
        <h2>📱 <span>معاينة</span> تطبيق مسجل الشاشة</h2>
        <p>واجهة المستخدم باللغة العربية • تصميم Android</p>
    </div>

    <!-- Toast Simulation -->
    <div class="toast-sim" id="toast">
        <span class="toast-icon">⛔</span>
        تم رفض إذن مشاركة الشاشة
    </div>

    <!-- Phone -->
    <div class="phone-wrapper">
        <div class="phone">
            <!-- Preview Badge -->
            <div class="preview-badge">معاينة حية</div>

            <!-- Notch -->
            <div class="phone-notch"></div>

            <!-- Status Bar -->
            <div class="status-bar">
                <span class="time" id="time">12:00</span>
                <div class="status-icons">
                    <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                </div>
            </div>

            <!-- Screen -->
            <div class="phone-screen">
                <!-- App Bar -->
                <div class="app-bar">
                    <div class="app-icon">
                        <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                    </div>
                    <h1>مسجل الشاشة</h1>
                </div>

                <!-- Content -->
                <div class="content">
                    <p class="welcome-text">
                        <strong>مرحباً بك</strong> في تطبيق تسجيل الشاشة
                    </p>

                    <!-- Screen Preview -->
                    <div class="screen-preview" id="screenPreview">
                        <div class="recording-indicator" id="recIndicator">
                            <div class="dot"></div>
                            <span>جاري التسجيل</span>
                        </div>

                        <div class="preview-icon" id="previewIcon">
                            <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                            <p>معاينة الشاشة هنا</p>
                        </div>
                    </div>

                    <!-- Button -->
                    <button class="start-button" id="toggleBtn" onclick="toggleRecording()">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        ابدأ
                    </button>
                </div>

                <!-- Nav Bar -->
                <div class="nav-bar">
                    <div class="home-indicator"></div>
                </div>
            </div>

            <!-- Side Buttons -->
            <div class="phone-side-buttons">
                <div class="side-btn"></div>
                <div class="side-btn" style="height: 70px;"></div>
                <div class="side-btn"></div>
            </div>
        </div>
    </div>

    <!-- Info Cards -->
    <div class="info-cards" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
        <div class="info-card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h3>واجهة عربية</h3>
            <p>دعم كامل للغة العربية</p>
        </div>
        <div class="info-card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24"><path d="M12 1C8.14 1 5 4.14 5 8c0 4.42 3.58 8 7 8 .59 0 1.17-.06 1.73-.18L16 20h2l-1.86-4.44C17.91 14.18 19 11.72 19 9c0-3.86-3.14-7-7-7zm-2 8H8V7h2v2zm4 0h-2V7h2v2z" fill="currentColor"/></svg>
            </div>
            <h3>RTL</h3>
            <p>محاذاة من اليمين</p>
        </div>
        <div class="info-card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
            </div>
            <h3>Android 14</h3>
            <p>متوافق مع أحدث إصدار</p>
        </div>
    </div>

    <script>
        // Live clock
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${h}:${m}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Toggle recording simulation
        let isRecording = false;
        function toggleRecording() {
            const btn = document.getElementById('toggleBtn');
            const recIndicator = document.getElementById('recIndicator');
            const previewIcon = document.getElementById('previewIcon');
            const toast = document.getElementById('toast');
            const screenPreview = document.getElementById('screenPreview');

            isRecording = !isRecording;

            if (isRecording) {
                btn.classList.add('recording');
                btn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    إيقاف
                `;
                recIndicator.classList.add('active');
                previewIcon.innerHTML = `
                    <svg viewBox="0 0 24 24" style="fill: rgba(255,255,255,0.3);"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                    <p style="color: rgba(255,255,255,0.15);">جاري تسجيل الشاشة...</p>
                `;
                screenPreview.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                screenPreview.style.background = 'linear-gradient(135deg, #2a1a1a 0%, #1e1e3a 100%)';
            } else {
                btn.classList.remove('recording');
                btn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    ابدأ
                `;
                recIndicator.classList.remove('active');
                previewIcon.innerHTML = `
                    <svg viewBox="0 0 24 24" style="fill: rgba(255,255,255,0.15);"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                    <p style="color: rgba(255,255,255,0.25);">معاينة الشاشة هنا</p>
                `;
                screenPreview.style.borderColor = 'rgba(255,255,255,0.05)';
                screenPreview.style.background = 'linear-gradient(135deg, #1e1e3a 0%, #2a1a4e 100%)';

                // Show permission denied toast on stop
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        // Generate particles
        const particlesContainer = document.querySelector('.particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 8}s`;
            particle.style.width = `${Math.random() * 3 + 2}px`;
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
