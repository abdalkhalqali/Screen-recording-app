plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
}

android {
    namespace 'io.codingskuy.qa_snap_demo'
    compileSdk 34

    defaultConfig {
        applicationId "io.codingskuy.qa_snap_demo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Product Flavors for different environments
    flavorDimensions = ["environment"]

    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"

            buildConfigField "String", "ENVIRONMENT", "\"development\""
            buildConfigField "String", "BASE_URL", "\"https://api-dev.example.com\""
            buildConfigField "boolean", "ENABLE_QA_SNAP", "false"
            buildConfigField "boolean", "ENABLE_LOGGING", "true"

            resValue "string", "app_name", "QA Snap Demo (Dev)"
        }

        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"

            buildConfigField "String", "ENVIRONMENT", "\"staging\""
            buildConfigField "String", "BASE_URL", "\"https://api-staging.example.com\""
            buildConfigField "boolean", "ENABLE_QA_SNAP", "true"
            buildConfigField "boolean", "ENABLE_LOGGING", "true"

            resValue "string", "app_name", "QA Snap Demo (Staging)"
        }

        production {
            dimension "environment"
            // No suffix for production - clean application ID

            buildConfigField "String", "ENVIRONMENT", "\"production\""
            buildConfigField "String", "BASE_URL", "\"https://api.example.com\""
            buildConfigField "boolean", "ENABLE_QA_SNAP", "false"
            buildConfigField "boolean", "ENABLE_LOGGING", "false"

            resValue "string", "app_name", "QA Snap Demo"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            // Debug-specific configurations
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release-specific configurations
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':qa-snap-sdk')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}